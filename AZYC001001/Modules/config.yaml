# 策略编号（用于输出与标识）
strategy_id: AZYC001001

# ETF 标的代码（option_code 可从这里自动提取，如 159915）
etf_symbol: S.CN.SZSE.159915

# 回测起止日期（含首尾）
start_date: "2023-01-01"
end_date: "2025-12-31"

# 行情频率（当前支持 minute1）
frequency: minute1

# Put 目标执行价偏移（目标=现价-偏移）
put_offset_abs: 0.15
# Call 目标执行价偏移（目标=现价+偏移）
call_offset_abs: 0.05
# 到期筛选规则：near_month=近月，next_month_2nd=次近月
expiry_rule: near_month

# 信号 bar 最小成交量过滤
min_volume_signal: 10
# 成交 bar 最小成交量过滤
min_volume_fill: 10

# 期权单张手续费
cost_option_fee_per_contract: 0.0
# 期权滑点（tick）
cost_option_slippage_ticks: 0.0
# ETF 手续费率
cost_etf_fee_rate: 0.0
# ETF 滑点（bps）
cost_etf_slippage_bps: 0.0

# 固定本金（不复利），用于 capital 模式定仓
initial_capital: 1000000.0
# 定仓模式：capital=按本金，fixed=按固定张数
contract_sizing: capital
# 无风险利率（用于夏普等指标）
risk_free_rate: 0.0

# 是否启用本地缓存
use_disk_cache: true
# 共享缓存目录（跨策略复用）
cache_dir: ../../DataCache

# 日内从该时间开始扫描新开仓
entry_start_time: "09:30:00"
# 仅对“回测起始阶段”生效：起始日后延迟几天才允许首次开仓（0=起始日即可开）
trade_start_offset_days: 0

# 输出目录（相对 config 文件）
output_dir: ../outputs
